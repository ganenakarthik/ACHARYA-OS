version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: acharya_postgres
    environment:
      POSTGRES_USER: acharya
      POSTGRES_PASSWORD: acharya_password
      POSTGRES_DB: acharya_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: acharya_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
